name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Pinned: "ubuntu-latest" is migrating to Ubuntu 26, which may change the
    # preinstalled Android SDK/NDK. 24.04 is the image this build was tested on.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Caches compiled Rust dependencies. cache-on-failure keeps the progress
      # even when a run fails, so the next attempt starts much faster.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true

      - name: Install Android NDK 28.2.13676358
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      # Overwrites any local.properties that was uploaded from Windows.
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKpdf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
